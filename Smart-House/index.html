<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart House Viewer</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>

<p>WELCOME TO OUR SMART HOUSE!</p>

<a-entity id="rig" position="25 10 0">
    <a-entity id="camera" camera look-controls></a-entity>
</a-entity>

<a-scene mobile-ui>
    <a-assets>
        <a-asset-item id="house" response-type="arraybuffer" src="https://cdn.glitch.me/5ed68eaf-9ace-424a-a1fe-6ccb6f8169bc/model.glb?v=1669310826951"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#house" scale="1.3 1.3 1.3" position="0 0 0"></a-entity>
    <a-sky color="#ECECEC"></a-sky>

    <!-- Arrow buttons for movement -->
    <a-entity position="-3 1.6 -4">
        <a-entity id="upButton" geometry="primitive: plane; width: 1; height: 1" material="color: blue" cursor-listener>
            <a-entity text="value: &#9650;; align: center; color: white; width: 2"></a-entity>
        </a-entity>
        <a-entity id="leftButton" geometry="primitive: plane; width: 1; height: 1" material="color: blue" cursor-listener position="-1.5 0 0">
            <a-entity text="value: &#9664;; align: center; color: white; width: 2"></a-entity>
        </a-entity>
        <a-entity id="rightButton" geometry="primitive: plane; width: 1; height: 1" material="color: blue" cursor-listener position="1.5 0 0">
            <a-entity text="value: &#9654;; align: center; color: white; width: 2"></a-entity>
        </a-entity>
        <a-entity id="downButton" geometry="primitive: plane; width: 1; height: 1" material="color: blue" cursor-listener position="0 -1.5 0">
            <a-entity text="value: &#9660;; align: center; color: white; width: 2"></a-entity>
        </a-entity>
    </a-entity>

    <!-- Restrict movement on mobile devices -->
    <a-entity id="mobileControls" position="0 0 0" visible="false">
        <a-plane color="transparent" height="10" width="10"></a-plane>
    </a-entity>
</a-scene>

<script>
    AFRAME.registerComponent('cursor-listener', {
        init: function () {
            var el = this.el;
            el.addEventListener('click', function () {
                var id = el.getAttribute('id');
                switch (id) {
                    case 'upButton':
                        // Move forward logic here
                        break;
                    case 'leftButton':
                        // Move left logic here
                        break;
                    case 'rightButton':
                        // Move right logic here
                        break;
                    case 'downButton':
                        // Move backward logic here
                        break;
                }
            });
        }
    });

    AFRAME.registerComponent('mobile-controls', {
        init: function () {
            if (AFRAME.utils.device.isMobile()) {
                var el = this.el;
                var mobileControls = document.getElementById('mobileControls');
                mobileControls.setAttribute('visible', 'true');
                el.addEventListener('touchstart', function (evt) {
                    el.emit('mousedown', evt.detail);
                });
                el.addEventListener('touchmove', function (evt) {
                    el.emit('mousemove', evt.detail);
                });
                el.addEventListener('touchend', function (evt) {
                    el.emit('mouseup', evt.detail);
                });
            }
        }
    });

    // Attach the mobile-controls component to the camera rig
    document.getElementById('rig').setAttribute('mobile-controls', '');
</script>

</body>
</html>
