<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <title>Smart House Viewer</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body>

  <p>WELCOME TO OUR SMART HOUSE!</p>

  <a-entity camera look-controls position="0 1.6 0"></a-entity>
  <a-entity id="rig" position="25 10 0">
    <a-entity id="camera" camera look-controls></a-entity>
  </a-entity>

  <a-scene>
    <a-assets>
      <a-asset-item id="house" response-type="arraybuffer" src="https://cdn.glitch.me/5ed68eaf-9ace-424a-a1fe-6ccb6f8169bc/model.glb?v=1669310826951"></a-asset-item>
    </a-assets>
    <a-entity gltf-model="#house" scale="1.3 1.3 1.3" position="0 0 0"></a-entity>
    <a-sky color="#ECECEC"></a-sky>

    <!-- Restrict movement on mobile devices -->
    <a-entity id="mobileControls" position="0 0 0" visible="false">
      <a-plane color="transparent" height="10" width="10"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('mobile-controls', {
      init: function () {
        if (AFRAME.utils.device.isMobile()) {
          var el = this.el;
          var mobileControls = document.getElementById('mobileControls');
          mobileControls.setAttribute('visible', 'true');
          el.addEventListener('touchstart', function (evt) {
            el.emit('mousedown', evt.detail);
          });
          el.addEventListener('touchmove', function (evt) {
            el.emit('mousemove', evt.detail);
          });
          el.addEventListener('touchend', function (evt) {
            el.emit('mouseup', evt.detail);
          });
        }
      }
    });

    // Attach the mobile-controls component to the camera rig
    document.getElementById('rig').setAttribute('mobile-controls', '');
  </script>
</body>

</html>
