<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart House Viewer</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://rawgit.com/Ctrl-Alt-Zen/aframe-mobile-controls/master/components/twoway-motion/twoway-motion.js"></script>

</head>
<body>

<p>WELCOME TO OUR SMART HOUSE!</p>

<a-entity id="rig" position="25 10 0">
    <a-entity id="camera" camera look-controls></a-entity>
</a-entity>

<a-scene mobile-ui>
    <a-assets>
        <a-asset-item id="house" response-type="arraybuffer" src="https://cdn.glitch.me/5ed68eaf-9ace-424a-a1fe-6ccb6f8169bc/model.glb?v=1669310826951"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#house" scale="1.3 1.3 1.3" position="0 0 0"></a-entity>
    <a-sky color="#ECECEC"></a-sky>

    <!-- Movement Buttons -->
    <a-entity position="0 0 -2">
        <a-circle color="#333" radius="0.1" position="-0.5 0 0" 
                  rotation="-90 0 0" onclick="move('forward')"></a-circle>
        <a-text value="↑" color="#fff" align="center" position="-0.5 0.03 0"></a-text>
    </a-entity>
    <a-entity position="0 0 -2">
        <a-circle color="#333" radius="0.1" position="0 0 0" 
                  rotation="-90 90 0" onclick="move('right')"></a-circle>
        <a-text value="→" color="#fff" align="center" position="0 0.03 0"></a-text>
    </a-entity>
    <a-entity position="0 0 -2">
        <a-circle color="#333" radius="0.1" position="0.5 0 0" 
                  rotation="-90 -90 0" onclick="move('left')"></a-circle>
        <a-text value="←" color="#fff" align="center" position="0.5 0.03 0"></a-text>
    </a-entity>
    <a-entity position="0 0 -2">
        <a-circle color="#333" radius="0.1" position="0 -0.5 0" 
                  rotation="-90 180 0" onclick="move('backward')"></a-circle>
        <a-text value="↓" color="#fff" align="center" position="0 -0.47 0"></a-text>
    </a-entity>

    <!-- Restrict movement on mobile devices -->
    <a-entity id="mobileControls" position="0 0 0" visible="false">
        <a-plane color="transparent" height="10" width="10"></a-plane>
    </a-entity>
</a-scene>

<script>
    AFRAME.registerComponent('mobile-controls', {
        init: function () {
            if (AFRAME.utils.device.isMobile()) {
                var el = this.el;
                var mobileControls = document.getElementById('mobileControls');
                mobileControls.setAttribute('visible', 'true');
                el.addEventListener('touchstart', function (evt) {
                    el.emit('mousedown', evt.detail);
                });
                el.addEventListener('touchmove', function (evt) {
                    el.emit('mousemove', evt.detail);
                });
                el.addEventListener('touchend', function (evt) {
                    el.emit('mouseup', evt.detail);
                });
            }
        }
    });

    // Attach the mobile-controls component to the camera rig
    document.getElementById('rig').setAttribute('mobile-controls', '');

    // Function to handle movement based on arrow button clicked
    function move(direction) {
        var camera = document.getElementById('camera').object3D;
        var speed = 0.1; // Adjust as needed
        var rotation = camera.rotation.y; // Get current rotation
        var x = 0;
        var z = 0;

        // Calculate movement direction based on camera rotation
        switch(direction) {
            case 'forward':
                x = -Math.sin(rotation);
                z = -Math.cos(rotation);
                break;
            case 'backward':
                x = Math.sin(rotation);
                z = Math.cos(rotation);
                break;
            case 'left':
                x = -Math.cos(rotation);
                z = Math.sin(rotation);
                break;
            case 'right':
                x = Math.cos(rotation);
                z = -Math.sin(rotation);
                break;
        }

        // Apply movement
        camera.position.x += x * speed;
        camera.position.z += z * speed;
    }
</script>

</body>
</html>
